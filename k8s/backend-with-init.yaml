apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: pluma-kanban
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
      - name: init-db
        image: postgres:15-alpine
        env:
        - name: PGPASSWORD
          value: "postgres"
        command: ['sh', '-c',
          'until pg_isready -h postgres -p 5432;
          do echo waiting for database; sleep 2; done;
          psql -h postgres -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = ''taskboard''" | grep -q 1 || psql -h postgres -U postgres -c "CREATE DATABASE taskboard"']
      containers:
      - name: backend
        image: europe-west1-docker.pkg.dev/pluma-development/project-t-repo/backend:latest
        env:
        - name: PORT
          value: "8080"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgres"
        - name: DB_NAME
          value: "taskboard"
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "50m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: pluma-kanban
spec:
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 8080
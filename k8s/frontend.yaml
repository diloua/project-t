apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: pluma-kanban
data:
  api-url: "http://backend:8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: pluma-kanban
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: europe-west1-docker.pkg.dev/pluma-development/project-t-repo/frontend:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "32Mi"
            cpu: "25m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: pluma-kanban
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 3000